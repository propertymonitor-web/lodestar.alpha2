name: Build LODESTAR firmware

run-name: "${{ github.event_name == 'workflow_dispatch' && format('LODESTAR: {0} / {1} / {2} ({3})', inputs.line1, inputs.line2, inputs.line3, inputs.env) || 'LODESTAR checks' }}"

# Two kinds of run:
#   * every push and pull request: the unit tests, plus a check that the patch still
#     applies to the current MeshCore (about a minute, no firmware build)
#   * "Run workflow" by hand: the same checks, then the full firmware build (about 6 minutes)
on:
  push:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      line1:
        description: "Splash line 1 (big). Type - to leave out"
        default: "LODESTAR"
        required: false
        type: string
      line2:
        description: "Splash line 2. Type - to leave out"
        default: "BY"
        required: false
        type: string
      line3:
        description: "Splash line 3. Type - to leave out"
        default: "FEAR REACTIVE"
        required: false
        type: string
      seconds:
        description: "How many seconds the splash stays on screen (1-30)"
        default: "5"
        required: true
        type: string
      env:
        description: "Firmware type (Lodestar patches the repeater)"
        default: heltec_v4_repeater
        required: true
        type: choice
        options:
          - heltec_v4_repeater
          - Xiao_S3_WIO_repeater
      publish:
        description: "Publish the result as a GitHub Release anyone can download"
        default: false
        required: false
        type: boolean
      release_tag:
        description: "NEW release tag, e.g. v0.2.0-alpha. Required when publishing; it must not exist yet"
        default: ""
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unit-test the scoring logic
        run: |
          g++ -std=c++17 -Wall -Wextra -Ilodestar lodestar/test/test_lodestar.cpp -o lodestar_test
          ./lodestar_test

  patch-check:
    name: Patch still applies to current MeshCore
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Get MeshCore
        run: git clone --depth 1 https://github.com/meshcore-dev/MeshCore.git

      - name: Apply Lodestar
        run: python tools/apply_lodestar.py --meshcore MeshCore

  build:
    name: Build firmware
    needs: [test, patch-check]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed only to publish a Release
    steps:
      - uses: actions/checkout@v4

      # Fail in seconds, not after the build, if the release cannot be made.
      # This workflow only ever creates a NEW release: re-using a tag would swap the
      # files but leave the old tag, source and notes in place.
      - name: Check the release tag (only when publishing)
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
        run: |
          if [ -z "$TAG" ]; then
            echo "::error::Publishing needs a release tag. Type a NEW one, for example v0.2.0-alpha."
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::A release named $TAG already exists. Choose a new tag; this workflow never overwrites a release."
            exit 1
          fi
          if [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "::warning::Publishing from branch '$GITHUB_REF_NAME'. Releases should normally be made from main."
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install tools
        run: pip install platformio pillow numpy

      - name: Get MeshCore
        run: git clone --depth 1 https://github.com/meshcore-dev/MeshCore.git

      - name: Apply Lodestar
        run: python tools/apply_lodestar.py --meshcore MeshCore

      - name: Generate splash
        env:
          LINE1: ${{ inputs.line1 }}
          LINE2: ${{ inputs.line2 }}
          LINE3: ${{ inputs.line3 }}
          SPLASH_SECONDS: ${{ inputs.seconds }}
        run: |
          python tools/make_splash.py --meshcore MeshCore \
            --line "$LINE1" --line "$LINE2" --line "$LINE3" \
            --logo "-" --seconds "$SPLASH_SECONDS" \
            --preview splash_preview.png

      - name: Build firmware
        working-directory: MeshCore
        env:
          FW_ENV: ${{ inputs.env }}
        run: |
          set -o pipefail
          pio run -t mergebin -e "$FW_ENV" 2>&1 | tee ../build.log

      - name: Show compile errors
        if: failure()
        run: |
          grep -E "error|undefined reference|No such file" build.log | head -25 | while IFS= read -r l; do
            echo "::error::${l:0:900}"
          done

      - name: Collect files
        env:
          FW_ENV: ${{ inputs.env }}
        run: |
          mkdir out
          cp "MeshCore/.pio/build/$FW_ENV/firmware-merged.bin" out/
          cp "MeshCore/.pio/build/$FW_ENV/firmware.bin" out/
          cp splash_preview.png out/
          git -C MeshCore rev-parse HEAD > out/meshcore_commit.txt

      - uses: actions/upload-artifact@v4
        with:
          name: lodestar-${{ inputs.env }}
          path: out/

      - name: Publish release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag }}
          FW_ENV: ${{ inputs.env }}
        run: |
          MC=$(cut -c1-10 out/meshcore_commit.txt)
          if [ "$FW_ENV" = "Xiao_S3_WIO_repeater" ]; then
            BOARD="the Seeed Studio XIAO ESP32S3 with the Wio-SX1262 kit (no screen, no GPS)"
          else
            BOARD="the Heltec WiFi LoRa 32 V4 R2 (ESP32-S3R2, OLED). Not for the V4-R8"
          fi
          NOTES="LODESTAR mobile-repeater firmware for $BOARD, by FEAR REACTIVE. Alpha test build ($FW_ENV) on MeshCore commit $MC.

          Download firmware-merged.bin and flash it at https://flasher.meshcore.io (Custom Firmware). firmware.bin is the application-only image for updating an existing install. See the README for setup and testing notes."
          # Always a new release (the tag was checked before the build). If the tag appeared
          # in the meantime this fails rather than overwriting anything.
          FILES="out/firmware-merged.bin out/firmware.bin"
          [ "$FW_ENV" = "Xiao_S3_WIO_repeater" ] || FILES="$FILES out/splash_preview.png"   # no screen on the XIAO, so no splash to preview
          gh release create "$TAG" $FILES \
            --target "$GITHUB_SHA" --title "LODESTAR $TAG" --notes "$NOTES" --prerelease
